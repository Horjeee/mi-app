        /* =========================================================
           RUNNING + GOOGLE MAPS REAL + GPS
           ========================================================= */
        function calcGeoDist(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function updateGoogleMapsIframe() {
            const rs = ui.runSession;
            const iframe = document.getElementById('gmaps-iframe');
            if (!iframe) return;
            const src = `https://maps.google.com/maps?q=${rs.viewCenter[0].toFixed(5)},${rs.viewCenter[1].toFixed(5)}&z=${rs.zoom}&t=${rs.mapType}&output=embed`;
            if (iframe.getAttribute('data-src') !== src) {
                iframe.setAttribute('data-src', src);
                iframe.src = src;
            }
        }

        function zoomRunMap(delta) {
            const rs = ui.runSession;
            rs.zoom = Math.max(12, Math.min(19, rs.zoom + delta));
            updateGoogleMapsIframe();
            drawRunOverlay();
        }

        function toggleGoogleMapType() {
            const rs = ui.runSession;
            rs.mapType = rs.mapType === 'k' ? 'm' : 'k';
            updateGoogleMapsIframe();
        }

        function openExternalGoogleMaps() {
            const rs = ui.runSession;
            window.open(`https://www.google.com/maps/search/?api=1&query=${rs.center[0]},${rs.center[1]}`, '_blank');
        }

        function locateUserCity(silent = false) {
            const rs = ui.runSession;
            const lbl = document.getElementById('run-city-label');
            rs.hasLocated = true;
            if (!('geolocation' in navigator)) {
                if (!silent && lbl) lbl.textContent = 'GPS no disponible · Usa el buscador';
                return;
            }
            if (lbl) lbl.textContent = 'Obteniendo ubicación real...';
            navigator.geolocation.getCurrentPosition(pos => {
                const c = [pos.coords.latitude, pos.coords.longitude];
                rs.center = c;
                rs.viewCenter = [...c];
                rs.zoom = 16;
                rs.city = `Tu ubicación (${c[0].toFixed(4)}, ${c[1].toFixed(4)})`;
                if (lbl) lbl.textContent = rs.city;
                updateGoogleMapsIframe();
                drawRunOverlay();
            }, () => {
                rs.city = 'Permiso GPS pendiente · Escribe tu ciudad';
                if (lbl) lbl.textContent = rs.city;
            }, { enableHighAccuracy: true, timeout: 8000 });
        }

        async function searchRunLocation() {
            const inp = document.getElementById('run-search');
            const query = inp ? inp.value.trim() : '';
            if (!query) return;
            const rs = ui.runSession;
            const lbl = document.getElementById('run-city-label');
            if (lbl) lbl.textContent = `Buscando "${query}"...`;
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(query)}`);
                const data = await res.json();
                if (data && data[0]) {
                    const lat = parseFloat(data[0].lat);
                    const lon = parseFloat(data[0].lon);
                    rs.center = [lat, lon];
                    rs.viewCenter = [lat, lon];
                    rs.zoom = 15;
                    rs.city = data[0].display_name.split(',').slice(0, 2).join(',');
                    rs.selectedLogId = null;
                    if (lbl) lbl.textContent = rs.city;
                    updateGoogleMapsIframe();
                    drawRunOverlay();
                } else if (lbl) {
                    lbl.textContent = 'No encontrado · Prueba otra calle o ciudad';
                }
            } catch (e) {
                if (lbl) lbl.textContent = rs.city;
            }
        }

        function drawRunOverlay() {
            const canvas = document.getElementById('run-canvas');
            if (!canvas) return;
            const rect = canvas.parentElement.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            const ctx = canvas.getContext('2d');
            ctx.scale(dpr, dpr);
            ctx.clearRect(0, 0, rect.width, rect.height);

            const rs = ui.runSession;
            const selectedLog = rs.selectedLogId ? appState.runLogs.find(l => l.id === rs.selectedLogId) : null;
            const path = rs.recording && rs.path.length > 0 ? rs.path : (selectedLog?.path || []);
            if (path.length < 2) return;

            const scale = Math.pow(2, rs.zoom) * 1.15;
            const toPt = ([lat, lng]) => ({
                x: rect.width / 2 + (lng - rs.viewCenter[1]) * scale,
                y: rect.height / 2 - (lat - rs.viewCenter[0]) * scale * 1.26
            });
            ctx.strokeStyle = rs.recording ? '#10B981' : '#2563EB';
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            path.forEach((p, i) => {
                const pt = toPt(p);
                i === 0 ? ctx.moveTo(pt.x, pt.y) : ctx.lineTo(pt.x, pt.y);
            });
            ctx.stroke();
        }

        function simulateStepForward() {
            const rs = ui.runSession;
            if (!rs.recording) return;
            const last = rs.path[rs.path.length - 1] || rs.center;
            const next = [last[0] + (Math.random() * 0.0012 + 0.0004), last[1] + (Math.random() * 0.0014 - 0.0003)];
            rs.km += calcGeoDist(last[0], last[1], next[0], next[1]);
            rs.path.push(next);
            rs.center = next;
            rs.viewCenter = [...next];
            updateGoogleMapsIframe();
            drawRunOverlay();
            const kmEl = document.getElementById('run-km');
            if (kmEl) kmEl.textContent = `${rs.km.toFixed(2)} km`;
        }

        function toggleRunningSession() {
            const rs = ui.runSession;
            if (!rs.recording) {
                rs.recording = true;
                rs.seconds = 0;
                rs.km = 0;
                rs.path = [[...rs.center]];
                if ('geolocation' in navigator) {
                    rs.watchId = navigator.geolocation.watchPosition(pos => {
                        const c = [pos.coords.latitude, pos.coords.longitude];
                        if (rs.path.length) {
                            rs.km += calcGeoDist(rs.path[rs.path.length - 1][0], rs.path[rs.path.length - 1][1], c[0], c[1]);
                        }
                        rs.path.push(c);
                        rs.center = c;
                        rs.viewCenter = [...c];
                        updateGoogleMapsIframe();
                        drawRunOverlay();
                    }, () => {}, { enableHighAccuracy: true });
                }
                rs.timerId = setInterval(() => {
                    rs.seconds++;
                    const tEl = document.getElementById('run-time');
                    const kEl = document.getElementById('run-km');
                    const pEl = document.getElementById('run-pace');
                    if (tEl) tEl.textContent = `${String(Math.floor(rs.seconds / 60)).padStart(2, '0')}:${String(rs.seconds % 60).padStart(2, '0')}`;
                    if (kEl) kEl.textContent = `${rs.km.toFixed(2)} km`;
                    if (pEl && rs.km > 0.02) {
                        const paceSec = Math.round(rs.seconds / rs.km);
                        pEl.textContent = `${Math.floor(paceSec / 60)}:${String(paceSec % 60).padStart(2, '0')} /km`;
                    }
                }, 1000);
            } else {
                clearInterval(rs.timerId);
                if (rs.watchId) navigator.geolocation.clearWatch(rs.watchId);
                rs.recording = false;
                const km = Math.max(0.25, parseFloat(rs.km.toFixed(2)));
                const mins = Math.max(2, Math.round(rs.seconds / 60) || 4);
                const id = Date.now();
                appState.runLogs.unshift({
                    id,
                    title: `Carrera GPS ${new Date().toLocaleDateString('es-ES', { day: '2-digit', month: 'short' })}`,
                    city: rs.city,
                    km,
                    mins,
                    date: 'Hoy',
                    path: [...rs.path]
                });
                rs.selectedLogId = id;
                registerStreakProgress();
                saveState();
            }
            renderApp();
        }

                    <div class="flex items-center justify-between">
                        <span class="text-sm font-bold">Modo Oscuro Liquid Glass</span>
                        <div class="ui-switch ${appState.settings.darkMode ? 'on' : ''}" onclick="toggleDarkMode()"><div class="ui-switch-thumb"></div></div>
                    </div>

                    <div class="flex items-center justify-between pt-2.5" style="border-top: 0.5px solid var(--border-color)">
                        <div>
                            <p class="text-sm font-bold">Confeti al 100% de tareas</p>
                            <p class="text-[11px]" style="color: var(--text-secondary)">Explosión lateral al completar el día</p>
                        </div>
                        <div class="ui-switch ${appState.settings.confetti !== false ? 'on' : ''}" onclick="appState.settings.confetti=!(appState.settings.confetti!==false); saveState(); renderApp()"><div class="ui-switch-thumb"></div></div>
                    </div>

                    <div class="pt-2.5" style="border-top: 0.5px solid var(--border-color)">
                        <p class="text-sm font-bold mb-2">Color de acento</p>
                        <div class="flex items-center justify-between">
                            ${[
                                { hex: '#007AFF', soft: 'rgba(0, 122, 255, 0.14)' },
                                { hex: '#FF6900', soft: 'rgba(255, 105, 0, 0.16)' },
                                { hex: '#10B981', soft: 'rgba(16, 185, 129, 0.16)' },
                                { hex: '#AF52DE', soft: 'rgba(175, 82, 222, 0.16)' },
                                { hex: '#F43F5E', soft: 'rgba(244, 63, 94, 0.16)' }
                            ].map(c => `<button onclick="appState.settings.accent='${c.hex}'; appState.settings.accentSoft='${c.soft}'; saveState(); renderApp()" class="w-8 h-8 rounded-full cursor-pointer" style="background-color: ${c.hex}; box-shadow: ${appState.settings.accent === c.hex ? '0 0 0 2px var(--bg-card), 0 0 0 4px ' + c.hex : 'none'}"></button>`).join('')}
                        </div>
                    </div>
                </div>

                <div class="app-card p-3.5 shadow-sm space-y-2.5">
                    <button onclick="exportBackup()" class="w-full py-2.5 rounded-xl text-xs font-extrabold cursor-pointer" style="background-color: var(--accent-soft); color: var(--accent-color)">📤 Copiar respaldo JSON</button>
                    <button onclick="localStorage.removeItem('${STORAGE_KEY}'); location.reload();" class="w-full py-2 rounded-xl text-xs font-extrabold text-rose-500 bg-rose-500/10 cursor-pointer">Restaurar datos iniciales</button>
                </div>
            `;
        }

        /* =========================================================
           UTILIDADES: UNDO TOAST, CONFETI LATERAL Y BACKUP
           ========================================================= */
        function showUndoToast(label, onUndo) {
            ui.undoData = onUndo;
            const toast = document.getElementById('undo-toast');
            const txt = document.getElementById('undo-text');
            if (toast && txt) {
                txt.textContent = label;
                toast.classList.remove('opacity-0', 'translate-y-4', 'pointer-events-none');
                clearTimeout(ui.undoTimer);
                ui.undoTimer = setTimeout(() => {
                    toast.classList.add('opacity-0', 'translate-y-4', 'pointer-events-none');
                    ui.undoData = null;
                }, 5500);
            }
        }

        function undoDeleteAction() {
            if (typeof ui.undoData === 'function') {
                ui.undoData();
                ui.undoData = null;
            }
            const toast = document.getElementById('undo-toast');
            if (toast) toast.classList.add('opacity-0', 'translate-y-4', 'pointer-events-none');
        }

        function launchSideConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            if (!canvas) return;
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const ctx = canvas.getContext('2d');
            const colors = ['#FF3B30', '#FF9500', '#FFCC00', '#34C759', '#007AFF', '#AF52DE', '#FF2D55'];
            const particles = [];

            for (let i = 0; i < 130; i++) {
                const fromLeft = i % 2 === 0;
                particles.push({
                    x: fromLeft ? 0 : canvas.width,
                    y: canvas.height * (0.42 + Math.random() * 0.42),
                    vx: (fromLeft ? 1 : -1) * (Math.random() * 8.5 + 3),
                    vy: -(Math.random() * 11 + 5),
                    size: Math.random() * 7 + 5,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rot: Math.random() * Math.PI * 2,
                    vRot: (Math.random() - 0.5) * 0.25
                });
            }

            let frame = 0;
            function step() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.26;
                    p.vx *= 0.985;
                    p.rot += p.vRot;
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rot);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.65);
                    ctx.restore();
                });
                frame++;
                if (frame < 140) requestAnimationFrame(step);
                else ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
            requestAnimationFrame(step);
        }

        function exportBackup() {
            const ta = document.createElement('textarea');
            ta.value = JSON.stringify(appState);
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            const banner = document.getElementById('push-banner');
            const title = document.getElementById('banner-title');
            const sub = document.getElementById('banner-sub');
            if (banner && title && sub) {
                title.textContent = '📤 Copia de seguridad lista';
                sub.textContent = 'Datos copiados al portapapeles';
                banner.classList.add('show');
                setTimeout(() => banner.classList.remove('show'), 3500);
            }
        }

        window.onload = function () {
            renderApp();
            attachSwipeNavigation();
            setTimeout(() => drawRunOverlay(), 150);
        };
    </script>
</body>
</html>
