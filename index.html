<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Mi Día">
    <meta name="theme-color" content="#F2F2F7" id="meta-theme-color">
    <title>Mi Día · Productividad & Fitness</title>

    <link rel="apple-touch-icon" href="./apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
    <link rel="manifest" href="./manifest.webmanifest">

    <!-- Leaflet 1.9.4 (versión fijada) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="" defer></script>

    <!-- CSS propio sin CDN de Tailwind -->
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <!-- Filtro SVG para refracción óptica Liquid Glass -->
    <svg width="0" height="0" class="sr-hidden" aria-hidden="true">
        <defs>
            <filter id="ios-liquid-refraction" x="-10%" y="-10%" width="120%" height="120%">
                <feTurbulence type="fractalNoise" baseFrequency="0.012 0.035" numOctaves="2" seed="7" result="liquidNoise"/>
                <feGaussianBlur in="liquidNoise" stdDeviation="3" result="smoothLiquid"/>
                <feDisplacementMap in="SourceGraphic" in2="smoothLiquid" scale="7" xChannelSelector="R" yChannelSelector="G"/>
            </filter>
        </defs>
    </svg>

    <main id="app-screen" class="app-shell"></main>

    <script type="module" src="./js/app.js"></script>
</body>
</html>
